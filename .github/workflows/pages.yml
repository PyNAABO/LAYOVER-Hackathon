name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gulf-box/package-lock.json

      # GitHub Pages serves this repo from a sub-path (/LAYOVER-Hackathon/),
      # but every local run serves from the root. vite.config.ts reads
      # BASE_PATH, so the hosted build is emitted for the sub-path while the
      # committed `site/` stays root-relative for `npm run preview` and the
      # LAN demo. Getting this wrong renders a blank page: assets are
      # requested from /assets/... which 404s under the sub-path.
      - name: Build for the Pages sub-path
        working-directory: gulf-box
        env:
          BASE_PATH: /LAYOVER-Hackathon/
        run: npm ci && npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gulf-box/dist
      - id: deployment
        uses: actions/deploy-pages@v4
